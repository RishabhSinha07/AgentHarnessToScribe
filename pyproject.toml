[project]
name = "scribe"
version = "0.1.0"
description = "A whiteboard an agent can draw on while it teaches."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rishabh" }]
keywords = ["mcp", "agent", "whiteboard", "teaching", "diagram"]
dependencies = [
    "mcp>=2.0",
    "pillow>=10.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "websockets>=12.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
scribe-mcp = "scribe.mcp:main"
scribe-serve = "scribe.cli:serve"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The viewer page ships inside the package.
source-include = ["src/scribe/viewer/*.html"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
